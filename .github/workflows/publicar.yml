# Publica la plataforma: UN DEPLOY POR MARCA.
#
# El aislamiento entre marcas ES LA INSTALACIÓN. Un deploy lleva un vault y las
# credenciales de un proyecto de Supabase, y los de otra marca no existen en ese
# runner (D-17). No hay otra marca de la cual aislarse: por eso el paso que
# inspeccionaba el build buscando rutas ajenas se reemplazó por el de coherencia
# —marca, vault y base tienen que ser la misma—, que es el riesgo que sí queda.
#
# LA CONSOLA NO SE COMPILA ACÁ: `GROWTH_CONSOLE` no se define en ningún lado de
# este archivo, y sin esa variable `page.local.tsx` no entra en `pageExtensions`.
#
# LO QUE NO HACE, Y POR QUÉ:
#
#   · APLICA LAS MIGRACIONES, PERO NO RECONSTRUYE EL ÍNDICE. Son dos disparadores
#     distintos y tienen que seguir siéndolo: el ESQUEMA cambia cuando cambia el
#     código, que es un merge acá; el CONTENIDO cambia cuando se escribe un `.md`,
#     que es un merge en el repo del vault, y de ahí sale el rebuild. Si el
#     rebuild viviera en este workflow, publicar un tweet no actualizaría el
#     dashboard hasta el próximo cambio de código.
#
#   · NO INGIERE ANALYTICS. `ingest-analytics.py` necesita un CSV exportado a
#     mano de Meta o de X. Eso no puede pasar en CI.
#
#   · NO SINCRONIZA CON NOTION. Ese workflow se mudó a `tegu-labs/tegu-growth`
#     el 2026-09-26, que es donde está el contenido: el disparador de un sync es
#     que cambió una pieza, y acá un push a main no significa eso. Además desde
#     allá no hace falta un PAT para leer el vault.

name: publicar

on:
  workflow_dispatch:
    inputs:
      aplicar_sync:
        description: 'Aplicar el sync a Notion (escribe). Sin esto es dry-run.'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # EL ESQUEMA DEL ÍNDICE, ANTES QUE EL DEPLOY.
  #
  # Va primero y `publicar` depende de él a propósito: si el deploy saliera antes,
  # habría una ventana en la que la app nueva pide una columna que la base todavía
  # no tiene. PostgREST contesta eso con un 400 y la vista entera se cae — con
  # suerte. Con menos suerte la columna existe pero vacía, y se lee como un dato.
  #
  # POR QUÉ `psql` Y NO EL MCP NI LA API. Un cambio de esquema tiene que ser
  # reproducible: una marca nueva corre este job y queda con la MISMA base. Si las
  # migraciones se aplicaran a mano —por el MCP de Supabase o pegando en el SQL
  # Editor—, el esquema de producción pasaría a ser lo que alguien tipeó un día, y
  # el repo quedaría siendo una descripción de la base en vez de su fuente.
  #
  # El archivo se aplica ENTERO y es idempotente: `create table if not exists` más
  # un `drop policy if exists` delante de cada policy. Verificado corriéndolo dos
  # veces seguidas contra una base limpia.
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar supabase/aplicar-todo.sql
        env:
          # La connection string de Postgres, NO la service_role: PostgREST no
          # puede crear tablas. Sale de Supabase → Settings → Database.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Falta el secret SUPABASE_DB_URL: no se aplicaron las migraciones."
            echo "El deploy sigue, pero contra el esquema que la base ya tenga."
            exit 0
          fi

          # `ON_ERROR_STOP=1` porque psql por default sigue después de un error y
          # termina con exit 0: el job daría verde con media migración aplicada.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/aplicar-todo.sql

          # Que el script haya corrido no prueba que el esquema quedó bien: se
          # pregunta por lo que la app va a necesitar. Una tabla que falta acá es
          # un error del job, no un 400 en la cara de quien abra el dashboard.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc "
            select case
              when count(*) = 7 then 'OK: las 7 tablas del índice están'
              else 'FALTAN TABLAS: solo ' || count(*) || ' de 7'
            end
            from pg_tables
            where schemaname = 'public'
              and tablename in ('pieces','distribuciones','snapshots',
                                'creatives','formulas','builds','favoritos');
            select 'OK: rebuild_index existe' from pg_proc where proname = 'rebuild_index';
          " | tee /tmp/verificacion

          # `if` y no `grep ... && exit 1`: los `run` de Actions corren con
          # `bash -e`, y ahí un `&&` cuyo lado izquierdo no matchea devuelve 1 y
          # FALLA EL PASO — o sea, el chequeo daría rojo exactamente cuando todo
          # está bien. Escrito así, el único exit 1 es el que se quiere.
          if grep -q 'FALTAN' /tmp/verificacion; then
            exit 1
          fi
          if ! grep -q 'rebuild_index existe' /tmp/verificacion; then
            echo 'FALLA: rebuild_index no está. El repo del vault no podría reconstruir el índice.'
            exit 1
          fi

  # La matriz sale de config/sources.json y no de una lista escrita acá: agregar
  # una marca tiene que seguir siendo agregar un objeto a la config.
  marcas:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.leer.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
      - id: leer
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open('config/sources.json'))
          out = []
          for b in d['brands']:
              vr = b.get('vault_repo')
              if not vr:
                  # Fallar ruidoso: una marca sin origen declarado no se puede
                  # publicar, y saltearla en silencio daría un deploy incompleto.
                  raise SystemExit(
                      f"La marca '{b['id']}' no declara vault_repo en config/sources.json. "
                      "Sin eso no hay de dónde clonar su vault en CI."
                  )
              out.append({
                  'id': b['id'],
                  'repo': vr['repo'],
                  'ref': vr.get('ref', 'main'),
                  # Dónde se monta el vault dentro del runner, y la env var que
                  # lo reapunta. La convención es la de src/lib/sources.ts.
                  'env': 'VAULT_TEGU_DIR' if b['id'] == 'tegu'
                         else 'VAULT_' + b['id'].upper().replace('-', '_') + '_DIR',
              })
          print('lista=' + json.dumps(out))
          PY

  publicar:
    needs: [marcas, migrar]
    runs-on: ubuntu-latest
    strategy:
      # `fail-fast: false`: que una marca no compile no tiene por qué frenar el
      # deploy de otra. Son productos separados a propósito.
      fail-fast: false
      matrix:
        marca: ${{ fromJSON(needs.marcas.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4

      - name: Clonar el vault de ${{ matrix.marca.id }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.marca.repo }}
          ref: ${{ matrix.marca.ref }}
          path: .vaults/${{ matrix.marca.id }}
          # El GITHUB_TOKEN por defecto NO alcanza: el vault vive en otro
          # repositorio, y a veces en otra organización. Hace falta un PAT con
          # lectura sobre ese repo.
          token: ${{ secrets.VAULT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Build de ${{ matrix.marca.id }}
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          export ${{ matrix.marca.env }}="$GITHUB_WORKSPACE/.vaults/${{ matrix.marca.id }}"
          npm run build

      # EL CHEQUEO QUE REEMPLAZA AL DE AISLAMIENTO, y por qué hizo falta cambiarlo.
      #
      # Hasta el 2026-09-28 este paso inspeccionaba `.next/server/app/<marca>/`
      # buscando rutas de OTRA marca, porque un deploy podía servir a varias y el
      # recorte de `GROWTH_SOURCES` era la frontera. Con un vault por marca
      # (D-17) no hay otra marca en el build: ese chequeo no tendría nada que
      # inspeccionar y DARÍA VERDE SIN PROBAR NADA, que es peor que no tenerlo.
      #
      # El riesgo que sí existe ahora es otro: que el deploy lea el vault de una
      # marca y apunte a la base de otra. Eso no lo pesca ningún test — es
      # configuración— y el resultado sería un dashboard mostrando el contenido
      # de alguien con las credenciales de otro.
      - name: Verificar que marca, vault y base son la misma
        env:
          MARCA: ${{ matrix.marca.id }}
          VAULT_REPO: ${{ matrix.marca.repo }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          marca = os.environ['MARCA']
          declaradas = [b['id'] for b in json.load(open('config/sources.json'))['brands']]

          # 1. UNA marca declarada. Si un día son dos, D-17 hay que reabrirla: el
          #    aislamiento volvería a depender de un chequeo en runtime.
          if declaradas != [marca]:
              sys.exit(f'FALLA: config/sources.json declara {declaradas}, y este build '
                       f'es de "{marca}". Una instalación es una marca (D-17).')

          # 2. El vault clonado es el que la config dice.
          repo_declarado = next(b.get('vault_repo', {}).get('repo')
                                for b in json.load(open('config/sources.json'))['brands'])
          if repo_declarado != os.environ['VAULT_REPO']:
              sys.exit(f'FALLA: se clonó {os.environ["VAULT_REPO"]} pero la config '
                       f'declara {repo_declarado}.')

          # 3. El vault tiene contenido. Un vault vacío que igual buildea es la
          #    regla dura 1 con otro disfraz.
          raiz = pathlib.Path('.vaults') / marca
          mds = list(raiz.rglob('*.md'))
          if not mds:
              sys.exit(f'FALLA: no hay un solo .md en {raiz}.')

          # 4. La base configurada es la que la marca declara. Sin esto, un secret
          #    mal puesto manda el deploy de una marca contra los datos de otra —
          #    y ningún test lo pesca, porque es configuración y no código.
          url = os.environ.get('SUPABASE_URL', '')
          ref = next((b.get('supabase', {}).get('ref') for b in
                      json.load(open('config/sources.json'))['brands']), None)
          if ref and url and ref not in url:
              sys.exit(f'FALLA: la marca declara el proyecto {ref} y el build apunta '
                       f'a {url}. El deploy leería el vault de una y la base de otra.')
          if ref and not url:
              print(f'::warning::SUPABASE_URL no está: no se pudo '
                    f'verificar que el deploy apunte al proyecto {ref}.')

          print(f'OK: marca "{marca}" · vault {repo_declarado} ({len(mds)} .md) · base {ref}')
          PY

      - name: Deploy a Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          # Un proyecto de Vercel POR MARCA. Con uno solo, el último deploy pisaría
          # al anterior y las dos marcas terminarían en la misma URL.
          VERCEL_PROJECT_ID: ${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.marca.id)] }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Faltan VERCEL_TOKEN o VERCEL_PROJECT_ID_${{ matrix.marca.id }}."
            echo "El build y la verificación de aislamiento pasaron; no se subió nada."
            exit 0
          fi
          npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
